name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Laravel 13 (M-35): composer.json pede 8.3 ou 8.4. Testa os dois, já que a
        # hospedagem ainda não foi escolhida. O setup-php instala a última versão de cada ramo (M-42: precisa
        # ser 8.3.36+ / 8.4.27+, senão o composer install recusa).
        php: ['8.3', '8.4']
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mimoo
          POSTGRES_PASSWORD: mimoo
          POSTGRES_DB: mimoo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mimoo -d mimoo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Banco descartável do CI: nada aqui é segredo. Sem .env; tudo por variável de ambiente.
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: mimoo_test
      DB_USERNAME: mimoo
      DB_PASSWORD: mimoo

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pdo_sqlite, sqlite3, intl, zip, gd, bcmath
          coverage: none
          tools: composer:v2

      - name: Pasta de cache do Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache do Composer
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      # Só pacotes que vão para produção (--no-dev, pelo composer.lock) e só aviso alto ou crítico
      # reprova; baixo e médio aparecem no log como "ignored". Aviso sem severidade também reprova.
      - name: composer audit (produção, alto/crítico)
        run: composer audit --no-dev --locked --abandoned=report --ignore-severity=low --ignore-severity=medium

      - name: APP_KEY descartável
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Pint (formatação)
        run: vendor/bin/pint --test

      - name: Migrations no Postgres
        run: php artisan migrate:fresh --force

      # vendor/bin/phpunit e não `php artisan test`: sem .env o artisan marca os testes como "warning".
      # O grupo known-bugs (falha de propósito) fica fora pelo phpunit.xml.
      - name: PHPUnit
        run: vendor/bin/phpunit

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci

      # Só dependências de produção (--omit=dev): a cadeia do Tailwind 3 é de build (risco aceito, M-37).
      - name: npm audit (produção, alto/crítico)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (oxlint, teto de avisos no package.json)
        run: npm run lint

      - name: Build
        run: npm run build
