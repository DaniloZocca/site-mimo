name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # M-45: o banco de produção (Hostinger) é MariaDB; o CI usa a mesma versão. A suíte inclui o grupo `concurrency`
  # (dois processos PHP disputando o mesmo pedido). Os nomes dos checks não levam a versão do banco: trocar o
  # MariaDB é mudar só `matrix.mariadb`, sem mexer na regra de proteção da main.
  backend:
    name: backend (mariadb, php ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Laravel 13 (M-35): composer.json pede 8.3 ou 8.4; a Hostinger roda 8.4. O setup-php instala a última versão
        # de cada ramo (M-42: precisa ser 8.3.36+ / 8.4.27+, senão o composer install recusa).
        php: ['8.3', '8.4']
        # Versão exata da Hostinger (SELECT VERSION() = 11.8.9-MariaDB-log)
        mariadb: ['11.8.9']
    defaults:
      run:
        working-directory: backend

    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_USER: mimoo
          MARIADB_PASSWORD: mimoo
          MARIADB_DATABASE: mimoo_test
          MARIADB_ROOT_PASSWORD: mimoo
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    # Banco descartável do CI: nada aqui é segredo. Sem .env; tudo por variável de ambiente.
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: mimoo_test
      DB_USERNAME: mimoo
      DB_PASSWORD: mimoo
      MARIADB_VERSION: ${{ matrix.mariadb }}

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_sqlite, sqlite3, intl, zip, gd, bcmath, sodium
          coverage: none
          tools: composer:v2

      - name: Pasta de cache do Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache do Composer
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      # Só pacotes que vão para produção (--no-dev, pelo composer.lock) e só aviso alto ou crítico
      # reprova; baixo e médio aparecem no log como "ignored". Aviso sem severidade também reprova.
      - name: composer audit (produção, alto/crítico)
        run: composer audit --no-dev --locked --abandoned=report --ignore-severity=low --ignore-severity=medium

      - name: APP_KEY descartável
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Pint (formatação)
        run: vendor/bin/pint --test

      # Reprova se o serviço subir com outra versão (ex.: a tag da imagem mudar de sentido)
      - name: Versão do MariaDB
        run: |
          php -r '$p = new PDO("mysql:host=127.0.0.1;port=3306;dbname=mimoo_test", "mimoo", "mimoo");
            $v = $p->query("SELECT VERSION()")->fetchColumn(); echo $v, PHP_EOL;
            exit(str_starts_with($v, getenv("MARIADB_VERSION")."-MariaDB") ? 0 : 1);'

      - name: Migrations no MariaDB
        run: php artisan migrate:fresh --force

      # vendor/bin/phpunit e não `php artisan test`: sem .env o artisan marca os testes como "warning".
      # O grupo known-bugs (falha de propósito) fica fora pelo phpunit.xml.
      - name: PHPUnit
        run: vendor/bin/phpunit

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci

      # Só dependências de produção (--omit=dev): a cadeia do Tailwind 3 é de build (risco aceito, M-37).
      - name: npm audit (produção, alto/crítico)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (oxlint, teto de avisos no package.json)
        run: npm run lint

      - name: Build
        run: npm run build

  # M-53: os scripts que rodam no servidor (deploy.sh e backup.sh). bash -n e shellcheck sem nenhum aviso, e os
  # testes que simulam o servidor (php, composer2, rclone e mariadb-dump falsos), inclusive o que prova que o
  # deploy NÃO sai da manutenção quando o mimoo:check-production reprova. O shellcheck já vem no runner.
  scripts:
    name: scripts de deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: bash -n (sintaxe)
        run: for f in deploy/hostinger/*.sh deploy/hostinger/tests/*.sh; do bash -n "$f" && echo "ok $f"; done

      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck deploy/hostinger/*.sh deploy/hostinger/tests/*.sh

      - name: Teste do deploy.sh
        run: bash deploy/hostinger/tests/deploy_test.sh

      - name: Teste do backup.sh
        run: bash deploy/hostinger/tests/backup_test.sh
